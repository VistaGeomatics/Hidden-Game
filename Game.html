<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TOPO DASH – Vista Geomatics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f9fafb;
      touch-action: none; /* help prevent double-tap zoom / scroll */
    }

    canvas {
      border: 2px solid #444;
      background: #000;
      max-width: 100vw;
      height: auto;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="1100" height="400"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // ----------------------
    // GAME STATE
    // ----------------------
    let gameState = "title"; // "title", "playing", "gameover"

    // ----------------------
    // AUDIO
    // ----------------------
    const coinSound = new Audio("Coin Count Loop 02 End.mp3");
    coinSound.volume = 0.7;

    const deathSound = new Audio("VideoGameSequence_BW.50912.wav");
    deathSound.volume = 0.85;

    const gameMusic = new Audio("VideoGameLoading_BW.50941.wav");
    gameMusic.loop = true;
    gameMusic.volume = 0.45;

    function playSound(audio) {
      try {
        audio.currentTime = 0;
        audio.play();
      } catch (e) {}
    }

    // ----------------------
    // IMAGES
    // ----------------------
    const images = {
      title: new Image(),
      bg: new Image(),
      stand: new Image(),
      run1: new Image(),
      run2: new Image(),
      run3: new Image(),
      jump: new Image(),
      dumpster: new Image(),
      drone: new Image(),
      coin: new Image(),
      hat: new Image(),
      gameOver: new Image()
    };

    images.title.src    = "Title.png";
    images.bg.src       = "construction_bg.png";
    images.stand.src    = "Stand.png";
    images.run1.src     = "run-1.png";
    images.run2.src     = "Run-2.png";
    images.run3.src     = "Run-3.png";
    images.jump.src     = "Jump.png";
    images.dumpster.src = "obstacle.png";
    images.drone.src    = "drone.png";
    images.coin.src     = "Coin.png";
    images.hat.src      = "Hard-Hat.png";
    images.gameOver.src = "Game_over.png";

    let assetsLoaded = 0;
    const totalAssets = Object.keys(images).length;
    let assetsReady = false;

    function markAssetLoaded() {
      assetsLoaded++;
      if (assetsLoaded === totalAssets) {
        initGame();
      }
    }

    Object.values(images).forEach(img => {
      img.onload = markAssetLoaded;
      img.onerror = markAssetLoaded;
    });

    // ----------------------
    // HIGH SCORE
    // ----------------------
    let highScore = { score: 0, initials: "---" };
    try {
      const stored = localStorage.getItem("topo_dash_highscore");
      if (stored) {
        const parsed = JSON.parse(stored);
        if (parsed && typeof parsed.score === "number" && typeof parsed.initials === "string") {
          highScore = parsed;
        }
      }
    } catch (e) {}

    let enteringInitials = false;
    let newHighScore = false;
    let initials = ["A", "A", "A"];
    let currentInitialIndex = 0;

    // ----------------------
    // BACKGROUND
    // ----------------------
    let bgScrollX = 0;
    let baseScrollSpeed = 1.5;
    let groundY;

    function getWorldSpeed() {
      if (gameState !== "playing") return 0;

      // Progressive speed increase
      const difficulty = Math.min(score / 1200, 3); // ramps up earlier
      // extra forward movement while jumping to help clear obstacles
      const jumpBonus = (player.state === "jump") ? 1.2 : 0;

      return baseScrollSpeed + difficulty + jumpBonus;
    }

    function drawScrollingBackground() {
      const bgWidth = images.bg.width;
      const bgHeight = images.bg.height;
      if (!bgWidth || !bgHeight) return;

      const scale = canvas.height / bgHeight;
      const scaledWidth = bgWidth * scale;

      const scrollSpeed = getWorldSpeed();
      bgScrollX -= scrollSpeed;
      if (bgScrollX <= -scaledWidth) bgScrollX = 0;

      ctx.drawImage(images.bg, bgScrollX, 0, scaledWidth, canvas.height);
      ctx.drawImage(images.bg, bgScrollX + scaledWidth, 0, scaledWidth, canvas.height);
    }

    // ----------------------
    // PLAYER
    // ----------------------
    const player = {
      x: 180,
      y: 0,
      width: 80,
      height: 140,
      vy: 0,
      gravity: 1.05,
      onGround: true,
      state: "run",
      size: "big"
    };

    let bigHeight, bigWidth, smallHeight, smallWidth;
    let invulnerableFrames = 0;

    function setPlayerSize(size) {
      player.size = size;
      if (size === "big") {
        player.height = bigHeight;
        player.width = bigWidth;
      } else {
        player.height = smallHeight;
        player.width = smallWidth;
      }
      player.y = groundY - player.height;
    }

    function updatePlayer() {
      if (gameState !== "playing") return;

      if (invulnerableFrames > 0) invulnerableFrames--;

      player.vy += player.gravity;
      player.y += player.vy;

      const topMargin = 20;
      if (player.y < topMargin) {
        player.y = topMargin;
        if (player.vy < 0) player.vy = 0;
      }

      if (player.y + player.height >= groundY) {
        player.y = groundY - player.height;
        player.vy = 0;
        player.state = "run";
        player.onGround = true;
      } else {
        player.onGround = false;
      }
    }

    function getPlayerImage() {
      if (player.state === "jump") return images.jump;
      const idx = Math.floor(frameCount / 6) % 3;
      if (idx === 0) return images.run1;
      if (idx === 1) return images.run2;
      return images.run3;
    }

    function drawPlayer() {
      const img = getPlayerImage();
      if (!img) return;

      if (invulnerableFrames > 0 && (invulnerableFrames % 6 < 3)) {
        ctx.globalAlpha = 0.4;
        ctx.drawImage(img, player.x, player.y, player.width, player.height);
        ctx.globalAlpha = 1.0;
      } else {
        ctx.drawImage(img, player.x, player.y, player.width, player.height);
      }
    }

    // ----------------------
    // OBJECTS
    // ----------------------
    const dumpsters = [];
    const drones = [];
    const coins = [];
    const hats = [];

    let frameCount = 0;
    let score = 0;
    let coinsCollected = 0;

    let hazardTimer = 0;
    let coinTimer = 0;
    let hatTimer = 0;

    function spawnDumpster() {
      const scale = (bigHeight * 0.75) / images.dumpster.height;
      const width = images.dumpster.width * scale;
      const height = images.dumpster.height * scale;
      const xOffset = Math.random() * 40;
      const yOffset = Math.random() * 8 - 4;

      dumpsters.push({
        x: canvas.width + 120 + xOffset,
        y: groundY - height + yOffset,
        width,
        height
      });
    }

    function spawnDrone() {
      const scale = (bigHeight * 0.7) / images.drone.height;
      const width = images.drone.width * scale;
      const height = images.drone.height * scale;

      // Drones stay higher in the sky – walking under them is safe
      const minY = groundY - player.height * 2.7;
      const maxY = groundY - player.height * 1.5;
      const y = minY + Math.random() * (maxY - minY);

      drones.push({
        x: canvas.width + 140,
        y,
        width,
        height
      });
    }

    function spawnCoin() {
      const scale = (bigHeight * 0.55) / images.coin.height;
      const width = images.coin.width * scale;
      const height = images.coin.height * scale;

      const isHigh = Math.random() < 0.5;
      const offset = isHigh ? 120 : 40;
      const y = groundY - height - offset;

      coins.push({
        x: canvas.width + 160,
        y,
        width,
        height
      });
    }

    function spawnHat() {
      const scale = (bigHeight * 0.45) / images.hat.height;
      const width = images.hat.width * scale;
      const height = images.hat.height * scale;

      const offset = 70 + Math.random() * 40;
      const y = groundY - height - offset;

      hats.push({
        x: canvas.width + 200,
        y,
        width,
        height
      });
    }

    function updateWorldObjects() {
      if (gameState !== "playing") return;

      frameCount++;
      score++;

      const spd = getWorldSpeed();

      // Progressive difficulty: hazards spawn closer together as score increases
      hazardTimer--;
      if (hazardTimer <= 0) {
        if (Math.random() < 0.6) {
          spawnDumpster();
        } else {
          spawnDrone();
        }
        const base = 200; // starting spacing
        const jitter = Math.random() * 160;
        const diff = Math.min(score / 80, 220); // higher score = smaller gaps
        hazardTimer = Math.max(90, base + jitter - diff);
      }

      // Coins: slightly more frequent over time
      coinTimer--;
      if (coinTimer <= 0) {
        spawnCoin();
        const base = 260;
        const jitter = Math.random() * 130;
        const diff = Math.min(score / 150, 160);
        coinTimer = Math.max(130, base + jitter - diff);
      }

      // Hats: still rare but a bit more common later
      hatTimer--;
      if (hatTimer <= 0) {
        spawnHat();
        const base = 950;
        const jitter = Math.random() * 450;
        const diff = Math.min(score / 300, 250);
        hatTimer = Math.max(500, base + jitter - diff);
      }

      // Dumpsters – ground hazard
      updateList(dumpsters, obj => {
        obj.x -= spd;
        const hitbox = {
          x: obj.x + obj.width * 0.35,
          y: obj.y + obj.height * 0.6,
          width: obj.width * 0.3,
          height: obj.height * 0.4
        };
        checkHazardCollision(hitbox);
      });

      // Drones – ONLY a jumping hazard
      updateList(drones, obj => {
        obj.x -= spd;

        // Drone hitbox around central body
        const hitbox = {
          x: obj.x + obj.width * 0.2,
          y: obj.y + obj.height * 0.25,
          width: obj.width * 0.6,
          height: obj.height * 0.5
        };

        // Only check collision if player is in the air (jumping)
        if (!player.onGround) {
          const playerAirBox = {
            x: player.x + player.width * 0.25,
            y: player.y,
            width: player.width * 0.5,
            height: player.height * 0.7
          };

          if (rectsOverlap(playerAirBox, hitbox)) {
            if (invulnerableFrames > 0) {
              return false;
            }
            if (player.size === "big") {
              setPlayerSize("small");
              invulnerableFrames = 60;
            } else {
              triggerGameOver();
            }
          }
        }
      });

      // Coins
      updateList(coins, obj => {
        obj.x -= spd;
        if (rectsOverlap(player, obj)) {
          coinsCollected++;
          score += 100;
          playSound(coinSound);
          return true;
        }
      });

      // Hats
      updateList(hats, obj => {
        obj.x -= spd;
        if (rectsOverlap(player, obj)) {
          if (player.size === "small") {
            setPlayerSize("big");
            invulnerableFrames = 60;
          }
          return true;
        }
      });
    }

    function updateList(list, updateFn) {
      for (let i = list.length - 1; i >= 0; i--) {
        const obj = list[i];
        const remove = updateFn(obj);
        if (remove || obj.x + obj.width < -50) list.splice(i, 1);
      }
    }

    function checkHazardCollision(hitbox) {
      if (invulnerableFrames > 0) return;

      const playerBox = {
        x: player.x + player.width * 0.2,
        y: player.y + player.height * 0.1,
        width: player.width * 0.6,
        height: player.height * 0.9
      };

      if (rectsOverlap(playerBox, hitbox)) {
        if (player.size === "big") {
          setPlayerSize("small");
          invulnerableFrames = 60;
        } else {
          triggerGameOver();
        }
      }
    }

    function rectsOverlap(a, b) {
      return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
      );
    }

    // ----------------------
    // DRAW OBJECTS
    // ----------------------
    function drawDumpsters() {
      dumpsters.forEach(o => {
        ctx.drawImage(images.dumpster, o.x, o.y, o.width, o.height);
      });
    }

    function drawDrones() {
      drones.forEach(d => {
        ctx.drawImage(images.drone, d.x, d.y, d.width, d.height);
      });
    }

    function drawCoins() {
      coins.forEach(c => {
        ctx.drawImage(images.coin, c.x, c.y, c.width, c.height);
      });
    }

    function drawHats() {
      hats.forEach(h => {
        ctx.drawImage(images.hat, h.x, h.y, h.width, h.height);
      });
    }

    // ----------------------
    // HUD & SCREENS
    // ----------------------
    function drawHUD() {
      if (gameState !== "playing") return;

      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(10, 10, 260, 50);

      ctx.fillStyle = "#f9fafb";
      ctx.font = "16px system-ui";
      ctx.fillText("Score: " + score, 20, 35);
      ctx.fillText("Total Stations: " + coinsCollected, 20, 57);
    }

    function drawTitleScreen() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const img = images.title;
      if (img.width && img.height) {
        const maxW = canvas.width * 0.9;
        const maxH = canvas.height * 0.8;
        const scale = Math.min(maxW / img.width, maxH / img.height);
        const w = img.width * scale;
        const h = img.height * scale;
        const x = (canvas.width - w) / 2;
        const y = (canvas.height - h) / 2 - 10;
        ctx.drawImage(img, x, y, w, h);
      }

      ctx.fillStyle = "#f9fafb";
      ctx.textAlign = "center";
      ctx.font = "20px system-ui";
      ctx.fillText("Press SPACE / TAP / ↑ to Start", canvas.width / 2, canvas.height - 40);

      ctx.font = "14px system-ui";
      ctx.fillText(
        "High Score: " + highScore.initials + " " + highScore.score,
        canvas.width / 2,
        canvas.height - 18
      );
      ctx.textAlign = "start";
    }

    function drawGameOverScreen() {
      const img = images.gameOver;
      const maxW = canvas.width * 0.6;
      const maxH = canvas.height * 0.65;
      const scale = Math.min(maxW / img.width, maxH / img.height);
      const w = img.width * scale;
      const h = img.height * scale;
      const x = (canvas.width - w) / 2;
      const y = (canvas.height - h) / 2 - 20;

      ctx.fillStyle = "rgba(0,0,0,0.65)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, x, y, w, h);

      const baseY = canvas.height - 80;

      ctx.fillStyle = "#f9fafb";
      ctx.textAlign = "center";
      ctx.font = "18px system-ui";
      ctx.fillText(
        "Score: " + score + "   |   Total Stations: " + coinsCollected,
        canvas.width / 2,
        baseY
      );
      ctx.fillText(
        "High Score: " + highScore.initials + "  " + highScore.score,
        canvas.width / 2,
        baseY + 22
      );

      if (newHighScore && enteringInitials) {
        ctx.fillStyle = "#ff8080";
        ctx.fillText("NEW HIGH SCORE – ENTER INITIALS", canvas.width / 2, baseY - 24);
        ctx.fillStyle = "#f9fafb";
        ctx.fillText("Initials: " + initials.join(""), canvas.width / 2, baseY + 46);
        ctx.font = "14px system-ui";
        ctx.fillText(
          "(Type letters, Enter to save, Backspace to adjust)",
          canvas.width / 2,
          baseY + 66
        );
      } else {

        ctx.fillText("Press R or TAP to Restart", canvas.width / 2, baseY + 46);
      }

      ctx.textAlign = "start";
    }

    // ----------------------
    // GAME FLOW
    // ----------------------
    function triggerGameOver() {
      if (gameState === "gameover") return;

      playSound(deathSound);
      gameMusic.pause();

      gameState = "gameover";

      if (score > highScore.score) {
        newHighScore = true;
        enteringInitials = true;
        initials = ["A", "A", "A"];
        currentInitialIndex = 0;
      } else {
        newHighScore = false;
        enteringInitials = false;
      }
    }

    function resetGame() {
      dumpsters.length = 0;
      drones.length = 0;
      coins.length = 0;
      hats.length = 0;

      frameCount = 0;
      score = 0;
      coinsCollected = 0;
      invulnerableFrames = 0;
      newHighScore = false;
      enteringInitials = false;

      hazardTimer = 100;
      coinTimer = 150;
      hatTimer = 700;

      setPlayerSize("big");
      player.vy = 0;
      player.state = "run";
      player.onGround = true;
    }

    // ----------------------
    // INPUT – KEYBOARD
    // ----------------------
    window.addEventListener("keydown", (e) => {
      const key = e.key;

      // Initials entry
      if (enteringInitials && gameState === "gameover") {
        if (/^[a-zA-Z]$/.test(key)) {
          initials[currentInitialIndex] = key.toUpperCase();
          if (currentInitialIndex < 2) currentInitialIndex++;
        } else if (key === "Backspace") {
          if (currentInitialIndex > 0) currentInitialIndex--;
          initials[currentInitialIndex] = "A";
        } else if (key === "Enter") {
          enteringInitials = false;
          newHighScore = false;
          highScore = { score, initials: initials.join("") };
          try {
            localStorage.setItem("topo_dash_highscore", JSON.stringify(highScore));
          } catch (e) {}
        }
        return;
      }

      // Title screen -> start
      if (gameState === "title") {
        if (key === " " || key === "ArrowUp" || key === "Enter") {
          resetGame();
          try {
            gameMusic.currentTime = 0;
            gameMusic.play();
          } catch (e) {}
          gameState = "playing";
        }
        return;
      }

      // Playing
      if (gameState === "playing") {
        if ((key === " " || key === "ArrowUp") && player.onGround) {
          player.vy = -30;
          player.onGround = false;
          player.state = "jump";
        }
        return;
      }

      // Game over – restart
      if (gameState === "gameover" && !enteringInitials) {
        if (key === "r" || key === "R") {
          resetGame();
          try {
            gameMusic.currentTime = 0;
            gameMusic.play();
          } catch (e) {}
          gameState = "playing";
        }
      }
    });

    // ----------------------
    // INPUT – TOUCH (iPad / mobile)
    // ----------------------
    canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();

      // ignore taps while entering initials
      if (enteringInitials && gameState === "gameover") {
        return;
      }

      if (gameState === "title") {
        resetGame();
        try {
          gameMusic.currentTime = 0;
          gameMusic.play();
        } catch (err) {}
        gameState = "playing";
        return;
      }

      if (gameState === "playing") {
        if (player.onGround) {
          player.vy = -30;
          player.onGround = false;
          player.state = "jump";
        }
        return;
      }

      if (gameState === "gameover" && !enteringInitials) {
        resetGame();
        try {
          gameMusic.currentTime = 0;
          gameMusic.play();
        } catch (err) {}
        gameState = "playing";
        return;
      }
    }, { passive: false });

    // ----------------------
    // INIT
    // ----------------------
    function initGame() {
      bigHeight = canvas.height * 0.28;
      const bigScale = bigHeight / images.stand.height;
      bigWidth = images.stand.width * bigScale;

      smallHeight = bigHeight * 0.65;
      const smallScale = smallHeight / images.stand.height;
      smallWidth = images.stand.width * smallScale;

      groundY = canvas.height - 40;

      setPlayerSize("big");
      resetGame();
      gameState = "title";
      assetsReady = true;

      requestAnimationFrame(gameLoop);
    }

    // ----------------------
    // MAIN LOOP
    // ----------------------
    function gameLoop() {
      if (!assetsReady) {
        requestAnimationFrame(gameLoop);
        return;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawScrollingBackground();

      if (gameState === "title") {
        drawTitleScreen();
      } else {
        updateWorldObjects();
        updatePlayer();
        drawDumpsters();
        drawDrones();
        drawHats();
        drawCoins();
        drawPlayer();
        drawHUD();

        if (gameState === "gameover") {
          drawGameOverScreen();
        }
      }

      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
