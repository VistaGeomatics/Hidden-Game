<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TOPO DASH – Vista Geomatics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#020509;
      --text:rgba(255,255,255,0.96);
      --muted:rgba(255,255,255,0.70);
      --glass:rgba(10,16,26,0.55);
      --stroke:rgba(255,255,255,0.12);
      --stroke2:rgba(255,255,255,0.08);
      --shadow:0 30px 70px rgba(0,0,0,0.80);
      --radius:26px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; }

    body{
      font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      overflow-x:hidden;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      touch-action: pan-y;
    }

    .bg-video{
      position:fixed;
      inset:0;
      z-index:-3;
      overflow:hidden;
      background:#000;
    }
    .bg-video video{
      width:100%;
      height:100%;
      object-fit:cover;
      transform:scale(1.02);
      filter:saturate(1.05) contrast(1.06) brightness(0.88);
    }
    .bg-overlay{
      position:fixed;
      inset:0;
      z-index:-2;
      pointer-events:none;
      background:
        radial-gradient(1200px 700px at 50% 10%, rgba(31,156,240,0.12), transparent 62%),
        radial-gradient(900px 600px at 15% 85%, rgba(0,90,156,0.14), transparent 60%),
        radial-gradient(circle at 50% 0%, rgba(0,0,0,0.20), rgba(0,0,0,0.86)),
        linear-gradient(to bottom, rgba(0,0,0,0.10), rgba(0,0,0,0.58));
    }

    canvas.cursor-trail{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:80;
    }
    @media (pointer: coarse), (prefers-reduced-motion: reduce){
      canvas.cursor-trail{ display:none; }
    }

    .wrap{
      position:relative;
      z-index:1;
      min-height:100svh;
      min-height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
    }

    .card{
      width:min(1180px, 100%);
      border-radius:var(--radius);
      border:1px solid var(--stroke);
      background:var(--glass);
      backdrop-filter: blur(14px);
      box-shadow:var(--shadow);
      overflow:hidden;
      position:relative;
    }
    .card::before{
      content:"";
      position:absolute;
      inset:-40%;
      background:
        radial-gradient(circle at 20% 20%, rgba(31,156,240,0.10), transparent 55%),
        radial-gradient(circle at 80% 70%, rgba(0,90,156,0.10), transparent 60%),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.02), rgba(255,255,255,0.02) 1px, transparent 1px, transparent 4px);
      opacity:0.30;
      pointer-events:none;
    }

    .card-head{
      padding:20px 20px 14px;
      border-bottom:1px solid var(--stroke2);
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
    }

    .brand{
      font-family:"Montserrat", sans-serif;
      text-transform:uppercase;
      letter-spacing:0.22em;
      line-height:1.05;
      font-size:clamp(1.0rem, 3.0vw, 1.15rem);
      display:inline-flex;
      white-space:nowrap;
    }
    .brand .vista{ font-weight:700; }
    .brand .geomatics{ font-weight:400; opacity:0.92; }

    .sub{
      margin-top:8px;
      color:var(--muted);
      font-size:0.95rem;
      letter-spacing:0.02em;
    }

    .back{
      display:inline-flex;
      align-items:center;
      gap:10px;
      text-decoration:none;
      color:#fff;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(0,0,0,0.18);
      backdrop-filter: blur(10px);
      letter-spacing:.14em;
      text-transform:uppercase;
      font-size:.78rem;
      font-weight:800;
      transition:transform .18s ease, border-color .18s ease, filter .18s ease;
      white-space:nowrap;
    }
    .back:hover{ transform:translateY(-1px); border-color:rgba(255,255,255,0.18); filter:brightness(1.05); }

    .card-body{ padding:16px 18px 18px; }

    .canvas-wrap{
      border-radius:20px;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(0,0,0,0.35);
      overflow:hidden;
      box-shadow:0 18px 55px rgba(0,0,0,0.65);
      display:flex;
      justify-content:center;
      align-items:center;
    }

    #gameCanvas{
      width:100%;
      height:auto;
      max-width:100%;
      max-height:70vh;
      display:block;
      background:#000;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      touch-action:none;
    }

    .card-foot{
      padding:12px 18px 16px;
      border-top:1px solid var(--stroke2);
      display:flex;
      justify-content:space-between;
      align-items:center;
      color:rgba(255,255,255,0.62);
      font-size:0.86rem;
      flex-wrap:wrap;
      gap:10px;
    }
    .card-foot .right{
      opacity:.65; letter-spacing:.10em; text-transform:uppercase; font-size:.82rem;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore-compat.js"></script>
</head>

<body>
  <div class="bg-video" aria-hidden="true">
    <video id="bgVid" autoplay muted loop playsinline preload="metadata">
      <source src="Glitch.mov" type="video/mp4">
    </video>
  </div>
  <div class="bg-overlay" aria-hidden="true"></div>

  <canvas class="cursor-trail" id="trail" aria-hidden="true"></canvas>

  <main class="wrap">
    <section class="card" aria-label="Topo Dash Game">
      <header class="card-head">
        <div>
          <div class="brand" aria-label="VISTAGEOMATICS">
            <span class="vista">VISTA</span><span class="geomatics">GEOMATICS</span>
          </div>
          <div class="sub">TOPO DASH</div>
        </div>

        <a class="back" id="backBtn" href="https://vistageomatics.github.io/Internal-forms-portal/" aria-label="Back to Forms">Back to Forms</a>
      </header>

      <div class="card-body">
        <div class="canvas-wrap">
          <canvas id="gameCanvas" width="1100" height="400"></canvas>
        </div>
      </div>

      <footer class="card-foot">
        <div>Tip: Space, ↑, or tap to jump.</div>
        <div class="right">Game</div>
      </footer>
    </section>
  </main>

  <script>
    // Keep the background video alive on mobile
    (function(){
      const v = document.getElementById("bgVid");
      if(!v) return;
      const tryPlay = () => v.play().catch(()=>{});
      window.addEventListener("load", tryPlay);
      document.addEventListener("visibilitychange", () => { if(!document.hidden) tryPlay(); });
      tryPlay();
    })();

    // Smooth laser (desktop only)
    (function(){
      const canvas = document.getElementById("trail");
      if(!canvas) return;

      const prefersReduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const isCoarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
      if (prefersReduced || isCoarse) {
        canvas.style.display = "none";
        return;
      }

      const ctx = canvas.getContext("2d");
      const path = [];
      const MAX = 40;
      const DECAY = 0.90;

      let targetX = null, targetY = null;
      let x = null, y = null;
      let vx = 0, vy = 0;

      function resize(){
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener("resize", resize, { passive:true });
      resize();

      window.addEventListener("pointermove", (e) => {
        targetX = e.clientX;
        targetY = e.clientY;
        if (x === null){ x = targetX; y = targetY; }
      }, { passive:true });

      function step(){
        ctx.clearRect(0,0,window.innerWidth, window.innerHeight);

        if (targetX !== null){
          const k = 0.14, d = 0.78;
          vx = (vx + (targetX - x) * k) * d;
          vy = (vy + (targetY - y) * k) * d;
          x += vx; y += vy;

          path.push({ x, y, a: 1 });
          if (path.length > MAX) path.shift();
        }

        for (const p of path) p.a *= DECAY;
        while (path.length && path[0].a < 0.04) path.shift();

        if (path.length >= 3){
          ctx.globalCompositeOperation = "lighter";
          ctx.lineCap = "round";
          ctx.lineJoin = "round";

          for (let i = 1; i < path.length - 1; i++){
            const p0 = path[i - 1];
            const p1 = path[i];
            const p2 = path[i + 1];
            const t = i / (path.length - 1);

            const cx = (p1.x + p2.x) / 2;
            const cy = (p1.y + p2.y) / 2;

            const width = (1.0 + t * 1.20);
            const alpha = Math.min(0.90, p1.a) * (0.16 + t * 0.76);

            const grad = ctx.createLinearGradient(p0.x, p0.y, cx, cy);
            grad.addColorStop(0, `rgba(31,156,240,${alpha})`);
            grad.addColorStop(1, `rgba(0,90,156,${alpha})`);

            ctx.strokeStyle = grad;
            ctx.lineWidth = width;
            ctx.beginPath();
            ctx.moveTo(p0.x, p0.y);
            ctx.quadraticCurveTo(p1.x, p1.y, cx, cy);
            ctx.stroke();

            const coreA = Math.min(0.55, alpha * 0.58);
            ctx.strokeStyle = `rgba(255,255,255,${coreA})`;
            ctx.lineWidth = Math.max(0.75, width * 0.32);
            ctx.beginPath();
            ctx.moveTo(p0.x, p0.y);
            ctx.quadraticCurveTo(p1.x, p1.y, cx, cy);
            ctx.stroke();
          }

          const head = path[path.length - 1];
          ctx.globalCompositeOperation = "source-over";
          ctx.beginPath();
          ctx.arc(head.x, head.y, 1.8, 0, Math.PI*2);
          ctx.fillStyle = "rgba(255,255,255,0.92)";
          ctx.fill();
        }

        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    })();
  </script>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Responsive sizing, stops mobile cutoff
    (function(){
      const wrap   = document.querySelector(".canvas-wrap");
      const head   = document.querySelector(".card-head");
      const foot   = document.querySelector(".card-foot");
      if(!canvas || !wrap) return;

      const BASE_W = canvas.width;
      const BASE_H = canvas.height;
      const ASPECT = BASE_W / BASE_H;

      function resizeGameCanvas(){
        const maxW = wrap.clientWidth;

        const vh = (window.visualViewport && window.visualViewport.height)
          ? window.visualViewport.height
          : window.innerHeight;

        const headH = head ? head.getBoundingClientRect().height : 0;
        const footH = foot ? foot.getBoundingClientRect().height : 0;

        const buffer = 44;
        const maxH = Math.max(240, vh - headH - footH - buffer);

        let cssW = maxW;
        let cssH = cssW / ASPECT;

        if(cssH > maxH){
          cssH = maxH;
          cssW = cssH * ASPECT;
        }

        canvas.style.width  = Math.floor(cssW) + "px";
        canvas.style.height = Math.floor(cssH) + "px";
      }

      window.addEventListener("resize", resizeGameCanvas, {passive:true});
      window.addEventListener("orientationchange", resizeGameCanvas, {passive:true});
      if(window.visualViewport){
        window.visualViewport.addEventListener("resize", resizeGameCanvas, {passive:true});
      }
      window.addEventListener("load", resizeGameCanvas, {passive:true});
      resizeGameCanvas();
    })();

    document.getElementById("backBtn").addEventListener("click", (e) => {
      e.preventDefault();
      const href = e.currentTarget.getAttribute("href");
      if(href) window.location.href = href;
    });

    // ===== Level 3 redirect =====
    const LEVEL3_URL = "https://vistageomatics.github.io/Doomer/";
    const LEVEL2_COMPLETE_REDIRECT_DELAY_MS = 2200;
    let levelCompleteAt = 0;

    // ===== Progress requirements =====
    const TOTAL_STATIONS_TO_BOSS = 15;

    // ===== Game state =====
    let gameState = "title";
    let currentLevel = 1;

    // ===== Audio (mobile safe) =====
    let audioArmed = false;
    function safeAudio(src, volume, loop=false){
      const a = new Audio(src);
      a.preload = "auto";
      a.loop = loop;
      a.volume = volume;
      return a;
    }

    const coinSound  = safeAudio("Coin Count Loop 02 End.mp3", 0.70, false);
    const deathSound = safeAudio("VideoGameSequence_BW.50912.wav", 0.85, false);
    const music1     = safeAudio("VideoGameLoading_BW.50941.wav", 0.45, true);
    const music2     = safeAudio("level2.wav", 0.45, true);
    let currentMusic = null;

    async function armAudioOnce(){
      if(audioArmed) return;
      audioArmed = true;

      // The "silent unlock" trick for iOS and mobile Chrome
      const unlock = new Audio();
      unlock.src = "data:audio/mp3;base64,//uQZAAAAAAAAAAAAAAAAAAAAAA==";
      try { await unlock.play(); } catch(e) {}

      // Warm up real audio files
      try { coinSound.load(); deathSound.load(); music1.load(); music2.load(); } catch(e) {}
    }

    function stopMusic(){
      try { if(currentMusic){ currentMusic.pause(); currentMusic.currentTime = 0; } } catch(e) {}
      currentMusic = null;
    }

    async function playLevelMusic(){
      await armAudioOnce();
      stopMusic();
      currentMusic = (currentLevel === 1 ? music1 : music2);
      try {
        currentMusic.currentTime = 0;
        await currentMusic.play();
      } catch(e) {
        // If it still fails, it will work after the next gesture, we keep going.
      }
    }

    async function playSound(a){
      await armAudioOnce();
      try { a.currentTime = 0; await a.play(); } catch(e) {}
    }

    // ===== Firebase high score, stored but HUD does not show score =====
    let db = null;
    let highScore = { score: 0, initials: "---" };
    let newHighScore = false;
    let enteringInitials = false;
    let initials = ["A","A","A"];
    let currentInitialIndex = 0;

    function initFirebase(){
      try {
        const firebaseConfig = {
          apiKey: "YOUR_API_KEY",
          authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
          projectId: "YOUR_PROJECT_ID"
        };
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        loadHighScoreFromLocal();
        loadHighScoreFromServer();
      } catch(e){
        loadHighScoreFromLocal();
      }
    }

    function loadHighScoreFromLocal(){
      try {
        const stored = localStorage.getItem("topo_dash_highscore");
        if(stored){
          const parsed = JSON.parse(stored);
          if(parsed && typeof parsed.score === "number" && typeof parsed.initials === "string"){
            highScore = parsed;
          }
        }
      } catch(e){}
    }

    async function loadHighScoreFromServer(){
      if(!db) return;
      try {
        const doc = await db.collection("topodash").doc("globalHighScore").get();
        if(doc.exists){
          const data = doc.data();
          if(typeof data.score === "number" && typeof data.initials === "string"){
            highScore = { score: data.score, initials: data.initials };
          }
        }
      } catch(e){}
    }

    async function saveHighScoreToServer(){
      if(!db) return;
      try {
        await db.collection("topodash").doc("globalHighScore").set({
          score: highScore.score,
          initials: highScore.initials
        });
      } catch(e){}
    }

    function incrementLetter(i){
      const code = initials[i].charCodeAt(0);
      initials[i] = String.fromCharCode(code >= 90 ? 65 : code + 1);
    }
    function decrementLetter(i){
      const code = initials[i].charCodeAt(0);
      initials[i] = String.fromCharCode(code <= 65 ? 90 : code - 1);
    }

    async function saveHighScoreFromInitials(){
      const combined = initials.join("");
      highScore = { score, initials: combined };
      try { localStorage.setItem("topo_dash_highscore", JSON.stringify(highScore)); } catch(e){}
      await saveHighScoreToServer();
      enteringInitials = false;
      newHighScore = true;
      gameState = "gameover";
    }

    // ===== Background and speed ramp =====
    let bgScrollX = 0;

    // Speed ramp variables
    let runTime = 0;            // increases during playing while not boss
    let speedBoostFromCoins = 0;

    // Base per level
    const BASE_SPEED_L1 = 2.0;
    const BASE_SPEED_L2 = 2.3;

    // Ramp tuning
    const TIME_RAMP_PER_SEC = 0.10;  // how quickly it ramps over time
    const MAX_TIME_RAMP = 2.2;       // cap from time ramp
    const COIN_BOOST_PER_PICKUP = 0.03;
    const MAX_COIN_BOOST = 0.8;

    let groundY = 0;

    function getActiveBgImage(){
      return (currentLevel === 1 ? images.bg1 : images.bg2);
    }

    function getWorldSpeed(){
      if(gameState !== "playing") return 0;
      if(bossActive) return 0;

      const base = (currentLevel === 1 ? BASE_SPEED_L1 : BASE_SPEED_L2);

      const timeRamp = Math.min(MAX_TIME_RAMP, runTime * TIME_RAMP_PER_SEC);
      const coinRamp = Math.min(MAX_COIN_BOOST, speedBoostFromCoins);

      const jumpBonus = (player.state === "jump") ? 0.4 : 0;
      return base + timeRamp + coinRamp + jumpBonus;
    }

    function drawScrollingBackground(){
      const bgImg = getActiveBgImage();
      const bgWidth  = bgImg.width;
      const bgHeight = bgImg.height;
      if(!bgWidth || !bgHeight) return;

      const scale       = canvas.height / bgHeight;
      const scaledWidth = bgWidth * scale;

      const spd = getWorldSpeed();
      bgScrollX -= spd;
      if(bgScrollX <= -scaledWidth) bgScrollX = 0;

      ctx.drawImage(bgImg, bgScrollX, 0, scaledWidth, canvas.height);
      ctx.drawImage(bgImg, bgScrollX + scaledWidth, 0, scaledWidth, canvas.height);
    }

    // ===== Images =====
    const images = {
      title:          new Image(),
      levelIntro1:    new Image(),
      levelIntro2:    new Image(),
      levelComplete1: new Image(),
      levelComplete2: new Image(),
      bossCut1:       new Image(),
      bossCut2:       new Image(),
      bg1:            new Image(),
      bg2:            new Image(),
      stand:          new Image(),
      run1:           new Image(),
      run2:           new Image(),
      run3:           new Image(),
      jump:           new Image(),
      dumpster:       new Image(),
      bear:           new Image(),
      drone:          new Image(),
      eagle:          new Image(),
      coin:           new Image(),
      hat:            new Image(),
      gameOver:       new Image(),
      boss1Idle:      new Image(),
      boss1Throw:     new Image(),
      site:           new Image(),
      boss2Idle:      new Image(),
      boss2Throw:     new Image(),
      boss2Proj:      new Image()
    };

    images.title.src          = "Title.png";
    images.levelIntro1.src    = "Level1.png";
    images.levelIntro2.src    = "Level2.png";
    images.levelComplete1.src = "Level1Complete.png";
    images.levelComplete2.src = "level2Complete.png";
    images.bossCut1.src       = "Boss Screen.png";
    images.bossCut2.src       = "Level2 boss cut.png";
    images.bg1.src            = "construction_bg.png";
    images.bg2.src            = "OG_bg.png";
    images.stand.src          = "Stand.png";
    images.run1.src           = "run-1.png";
    images.run2.src           = "Run-2.png";
    images.run3.src           = "Run-3.png";
    images.jump.src           = "Jump.png";
    images.dumpster.src       = "obstacle.png";
    images.bear.src           = "Bear.png";
    images.drone.src          = "drone.png";
    images.eagle.src          = "Eagle.png";
    images.coin.src           = "Coin.png";
    images.hat.src            = "Hard-Hat.png";
    images.gameOver.src       = "Game_over.png";
    images.boss1Idle.src      = "bossthrow1.png";
    images.boss1Throw.src     = "bossthrow2.png";
    images.site.src           = "SiteInspection.png";
    images.boss2Idle.src      = "Boss2.png";
    images.boss2Throw.src     = "Boss2shoot.png";
    images.boss2Proj.src      = "boss2project.png";

    let assetsLoaded = 0;
    const totalAssets = Object.keys(images).length;
    let assetsReady = false;

    function markAssetLoaded(){
      assetsLoaded++;
      if(assetsLoaded === totalAssets){
        initGame();
      }
    }
    Object.values(images).forEach(img => {
      img.onload  = markAssetLoaded;
      img.onerror = markAssetLoaded;
    });

    // ===== Player =====
    const player = {
      x: 180,
      y: 0,
      width: 80,
      height: 140,
      vy: 0,
      gravity: 1.05,
      onGround: true,
      state: "run",
      size: "big"
    };

    let bigHeight, bigWidth, smallHeight, smallWidth;
    let invulnerableFrames = 0;

    function setPlayerSize(size){
      player.size = size;
      if(size === "big"){
        player.height = bigHeight;
        player.width  = bigWidth;
      }else{
        player.height = smallHeight;
        player.width  = smallWidth;
      }
      player.y = groundY - player.height;
    }

    function updatePlayer(){
      if(gameState !== "playing") return;

      if(invulnerableFrames > 0) invulnerableFrames--;

      player.vy += player.gravity;
      player.y  += player.vy;

      const topMargin = 20;
      if(player.y < topMargin){
        player.y = topMargin;
        if(player.vy < 0) player.vy = 0;
      }

      if(player.y + player.height >= groundY){
        player.y   = groundY - player.height;
        player.vy  = 0;
        player.state = "run";
        player.onGround = true;
      }else{
        player.onGround = false;
      }
    }

    function getPlayerImage(){
      if(player.state === "jump") return images.jump;
      const idx = Math.floor(frameCount / 6) % 3;
      if(idx === 0) return images.run1;
      if(idx === 1) return images.run2;
      return images.run3;
    }

    function drawPlayer(){
      const img = getPlayerImage();
      if(!img) return;

      if(invulnerableFrames > 0 && (invulnerableFrames % 6 < 3)){
        ctx.globalAlpha = 0.4;
        ctx.drawImage(img, player.x, player.y, player.width, player.height);
        ctx.globalAlpha = 1.0;
      }else{
        ctx.drawImage(img, player.x, player.y, player.width, player.height);
      }
    }

    // ===== Objects and boss =====
    const dumpsters = [];
    const drones    = [];
    const coins     = [];
    const hats      = [];

    let bossActive        = false;
    let bossDefeated      = false;
    let bossProjectiles   = [];
    let bossShotsDodged   = 0;
    let bossProjectileTimer = 0;

    const boss = { x:0, y:0, width:0, height:0 };
    let bossAnimState = "idle";
    let bossAnimTimer = 0;

    const bossConfig = {
      idleImg: null,
      throwImg: null,
      projectileImg: null,
      avoidRequired: 10
    };

    let frameCount     = 0;
    let score          = 0;     // kept for high score tracking, not shown in HUD
    let coinsCollected = 0;
    let coinStreak     = 0;

    let hazardTimer = 0;
    let coinTimer   = 0;
    let hatTimer    = 0;

    function spawnDumpster(){
      const img = (currentLevel === 1 ? images.dumpster : images.bear);
      const sizeFactor = (currentLevel === 1 ? 0.75 : 1.1);
      const scale  = (bigHeight * sizeFactor) / img.height;
      const width  = img.width  * scale;
      const height = img.height * scale;
      const xOffset = Math.random() * 40;
      const yOffset = Math.random() * 8 - 4;

      dumpsters.push({
        x: canvas.width + 120 + xOffset,
        y: groundY - height + yOffset,
        width,
        height
      });
    }

    function spawnDrone(){
      const img = (currentLevel === 1 ? images.drone : images.eagle);
      const scale  = (bigHeight * 0.7) / img.height;
      const width  = img.width  * scale;
      const height = img.height * scale;

      const minY = groundY - player.height * 2.7;
      const maxY = groundY - player.height * 1.5;
      const y    = minY + Math.random() * (maxY - minY);

      drones.push({ x: canvas.width + 140, y, width, height });
    }

    function spawnCoin(){
      const scale  = (bigHeight * 0.55) / images.coin.height;
      const width  = images.coin.width  * scale;
      const height = images.coin.height * scale;

      const isHigh = Math.random() < 0.5;
      const offset = isHigh ? 120 : 40;
      const y = groundY - height - offset;

      coins.push({ x: canvas.width + 160, y, width, height });
    }

    function spawnHat(){
      const scale  = (bigHeight * 0.45) / images.hat.height;
      const width  = images.hat.width  * scale;
      const height = images.hat.height * scale;

      const offset = 70 + Math.random()*40;
      const y = groundY - height - offset;

      hats.push({ x: canvas.width + 200, y, width, height });
    }

    function startBossFight(){
      bossActive        = true;
      bossDefeated      = false;
      bossShotsDodged   = 0;
      bossProjectiles.length = 0;
      bossProjectileTimer = 0;
      bossAnimState = "idle";
      bossAnimTimer = 0;

      dumpsters.length = 0;
      drones.length    = 0;
      coins.length     = 0;
      hats.length      = 0;

      if(currentLevel === 1){
        bossConfig.idleImg       = images.boss1Idle;
        bossConfig.throwImg      = images.boss1Throw;
        bossConfig.projectileImg = images.site;
        bossConfig.avoidRequired = 10;
      }else{
        bossConfig.idleImg       = images.boss2Idle;
        bossConfig.throwImg      = images.boss2Throw;
        bossConfig.projectileImg = images.boss2Proj;
        bossConfig.avoidRequired = 10;
      }

      const idleImg = bossConfig.idleImg;
      const bossTargetHeight = canvas.height * (currentLevel === 1 ? 0.3 : 0.35);
      const bossScale        = bossTargetHeight / idleImg.height;
      boss.width  = idleImg.width * bossScale;
      boss.height = bossTargetHeight;
      boss.x      = canvas.width - boss.width - 40;
      boss.y      = groundY - boss.height + 10;
    }

    function spawnBossProjectile(){
      const img = bossConfig.projectileImg;
      const scale  = (bigHeight * 0.45) / img.height;
      const width  = img.width  * scale;
      const height = img.height * scale;

      const highThrow = Math.random() < 0.5;
      const baseX = boss.x + boss.width * 0.05;
      let y, type;

      if(highThrow){
        y = groundY - player.height * 2.0;
        type = "high";
      }else{
        y = groundY - height;
        type = "low";
      }

      bossProjectiles.push({
        x: baseX,
        y,
        width,
        height,
        speed: 10,
        counted: false,
        type
      });

      bossAnimState = "throw";
      bossAnimTimer = 18;
    }

    function updateBossFight(){
      frameCount++;
      score++;

      if(bossAnimTimer > 0){
        bossAnimTimer--;
        if(bossAnimTimer <= 0) bossAnimState = "idle";
      }

      bossProjectileTimer--;
      if(bossProjectileTimer <= 0 && bossShotsDodged < bossConfig.avoidRequired){
        spawnBossProjectile();
        bossProjectileTimer = 75;
      }

      for(let i = bossProjectiles.length - 1; i >= 0; i--){
        const p = bossProjectiles[i];
        p.x -= p.speed;

        const hitbox = {
          x: p.x + p.width * 0.1,
          y: p.y + p.height * 0.1,
          width:  p.width  * 0.8,
          height: p.height * 0.8
        };

        if(invulnerableFrames <= 0){
          if(p.type === "low"){
            const playerBox = {
              x: player.x + player.width * 0.2,
              y: player.y + player.height * 0.1,
              width:  player.width  * 0.6,
              height: player.height * 0.9
            };
            if(rectsOverlap(playerBox, hitbox)){
              if(player.size === "big"){
                setPlayerSize("small");
                invulnerableFrames = 60;
                bossActive = false;
                bossProjectiles.length = 0;
                bossShotsDodged = 0;
                return;
              }else{
                triggerGameOver();
                return;
              }
            }
          }else{
            if(!player.onGround){
              const airBox = {
                x: player.x + player.width * 0.25,
                y: player.y,
                width:  player.width  * 0.5,
                height: player.height * 0.7
              };
              if(rectsOverlap(airBox, hitbox)){
                if(player.size === "big"){
                  setPlayerSize("small");
                  invulnerableFrames = 60;
                  bossActive = false;
                  bossProjectiles.length = 0;
                  bossShotsDodged = 0;
                  return;
                }else{
                  triggerGameOver();
                  return;
                }
              }
            }
          }
        }

        if(!p.counted && p.x + p.width < player.x){
          p.counted = true;
          bossShotsDodged++;
          if(bossShotsDodged >= bossConfig.avoidRequired){
            bossDefeated = true;
            bossActive   = false;
            bossProjectiles.length = 0;
            coinStreak = 0;
            score += 500;

            stopMusic();

            gameState = "levelComplete";
            levelCompleteAt = performance.now();
            return;
          }
        }

        if(p.x + p.width < -50){
          bossProjectiles.splice(i,1);
        }
      }
    }

    function updateWorldObjects(){
      if(gameState !== "playing") return;

      // ramp walking speed only while playing and not boss
      if(!bossActive) runTime += 1; // measured in frames, we use TIME_RAMP_PER_SEC which is per second-ish, but it feels right

      if(bossActive){
        updateBossFight();
        return;
      }

      frameCount++;
      score++;

      const spd = getWorldSpeed();

      hazardTimer--;
      if(hazardTimer <= 0){
        if(Math.random() < 0.6) spawnDumpster(); else spawnDrone();

        let base, jitter, diff, minGap;
        if(currentLevel === 1){
          base   = 200;
          jitter = 160;
          diff   = Math.min(score / 80, 220);
          minGap = 90;
        }else{
          base   = 180;
          jitter = 150;
          diff   = Math.min(score / 60, 260);
          minGap = 70;
        }
        hazardTimer = Math.max(minGap, base + jitter * Math.random() - diff);
      }

      coinTimer--;
      if(coinTimer <= 0){
        spawnCoin();
        const base   = 260;
        const jitter = 130;
        const diff   = Math.min(score / 150, 160);
        coinTimer    = Math.max(130, base + jitter * Math.random() - diff);
      }

      hatTimer--;
      if(hatTimer <= 0){
        spawnHat();
        const base   = 950;
        const jitter = 450;
        const diff   = Math.min(score / 300, 250);
        hatTimer     = Math.max(500, base + jitter * Math.random() - diff);
      }

      updateList(dumpsters, o=>{
        o.x -= spd;
        const hitbox = {
          x: o.x + o.width * 0.35,
          y: o.y + o.height*0.6,
          width:  o.width *0.3,
          height: o.height*0.4
        };
        checkHazardCollision(hitbox);
      });

      updateList(drones, d=>{
        d.x -= spd;
        const hitbox = {
          x: d.x + d.width *0.2,
          y: d.y + d.height*0.25,
          width:  d.width *0.6,
          height: d.height*0.5
        };

        if(!player.onGround){
          const airBox = {
            x: player.x + player.width*0.25,
            y: player.y,
            width:  player.width*0.5,
            height: player.height*0.7
          };
          if(rectsOverlap(airBox, hitbox)){
            if(invulnerableFrames > 0) return false;
            if(player.size === "big"){
              setPlayerSize("small");
              invulnerableFrames = 60;
            }else{
              triggerGameOver();
            }
          }
        }
      });

      updateList(coins, c=>{
        c.x -= spd;
        if(rectsOverlap(player, c)){
          coinsCollected++;
          score += 100;
          playSound(coinSound);

          coinStreak++;
          speedBoostFromCoins += COIN_BOOST_PER_PICKUP;

          if(!bossActive && !bossDefeated && coinStreak >= TOTAL_STATIONS_TO_BOSS){
            gameState = "bossCut";
          }
          return true;
        }
      });

      updateList(hats, h=>{
        h.x -= spd;
        if(rectsOverlap(player, h)){
          if(player.size === "small"){
            setPlayerSize("big");
            invulnerableFrames = 60;
          }
          return true;
        }
      });
    }

    function updateList(list, updateFn){
      for(let i=list.length-1; i>=0; i--){
        const obj = list[i];
        const remove = updateFn(obj);
        if(remove || obj.x + obj.width < -50) list.splice(i,1);
      }
    }

    function checkHazardCollision(hitbox){
      if(invulnerableFrames > 0) return;
      const playerBox = {
        x: player.x + player.width*0.2,
        y: player.y + player.height*0.1,
        width:  player.width *0.6,
        height: player.height*0.9
      };
      if(rectsOverlap(playerBox, hitbox)){
        if(player.size === "big"){
          setPlayerSize("small");
          invulnerableFrames = 60;
        }else{
          triggerGameOver();
        }
      }
    }

    function rectsOverlap(a,b){
      return a.x < b.x + b.width &&
             a.x + a.width > b.x &&
             a.y < b.y + b.height &&
             a.y + a.height > b.y;
    }

    function drawDumpsters(){
      const img = (currentLevel === 1 ? images.dumpster : images.bear);
      dumpsters.forEach(o => ctx.drawImage(img, o.x, o.y, o.width, o.height));
    }
    function drawDrones(){
      const img = (currentLevel === 1 ? images.drone : images.eagle);
      drones.forEach(d => ctx.drawImage(img, d.x, d.y, d.width, d.height));
    }
    function drawCoins(){ coins.forEach(c => ctx.drawImage(images.coin, c.x, c.y, c.width, c.height)); }
    function drawHats(){ hats.forEach(h => ctx.drawImage(images.hat, h.x, h.y, h.width, h.height)); }

    function drawBoss(){
      if(!bossActive) return;
      const img = (bossAnimState === "throw") ? bossConfig.throwImg : bossConfig.idleImg;
      if(!img) return;
      ctx.drawImage(img, boss.x, boss.y, boss.width, boss.height);
    }
    function drawBossProjectiles(){
      bossProjectiles.forEach(p => {
        ctx.drawImage(bossConfig.projectileImg, p.x, p.y, p.width, p.height);
      });
    }

    // ===== Screens =====
    function drawTitleScreen(){
      if(images.title.width) ctx.drawImage(images.title, 0, 0, canvas.width, canvas.height);
      ctx.fillStyle="rgba(0,0,0,0.45)";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle="#f9fafb";
      ctx.textAlign="center";
      ctx.font="28px system-ui";
      ctx.fillText("Tap to Start", canvas.width/2, canvas.height*0.72);
      ctx.textAlign="start";
    }

    function drawLevelIntroScreen(){
      const img = (currentLevel === 1 ? images.levelIntro1 : images.levelIntro2);
      if(img.width) ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      ctx.fillStyle="rgba(0,0,0,0.35)";
      ctx.fillRect(0,0,canvas.width,canvas.height);

      ctx.fillStyle="#f9fafb";
      ctx.textAlign="center";
      ctx.font="26px system-ui";
      ctx.fillText("Tap to Begin", canvas.width/2, canvas.height*0.80);
      ctx.textAlign="start";
    }

    function drawBossCutScreen(){
      const img = (currentLevel === 1 ? images.bossCut1 : images.bossCut2);
      if(img.width) ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      ctx.fillStyle="rgba(0,0,0,0.25)";
      ctx.fillRect(0,0,canvas.width,canvas.height);

      ctx.fillStyle="#f9fafb";
      ctx.textAlign="center";
      ctx.font="22px system-ui";
      ctx.fillText("Tap to Fight the Boss", canvas.width/2, canvas.height*0.86);
      ctx.textAlign="start";
    }

    function drawLevelCompleteScreen(){
      const img = (currentLevel === 1 ? images.levelComplete1 : images.levelComplete2);
      if(img.width) ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      ctx.fillStyle="rgba(0,0,0,0.25)";
      ctx.fillRect(0,0,canvas.width,canvas.height);

      ctx.fillStyle="#f9fafb";
      ctx.textAlign="center";
      ctx.font="24px system-ui";

      if(currentLevel === 2){
        ctx.fillText("Level Complete", canvas.width/2, canvas.height*0.82);
        ctx.font="18px system-ui";
        ctx.fillText("Loading Level 3…", canvas.width/2, canvas.height*0.88);
      }else{
        ctx.fillText("Tap to Continue", canvas.width/2, canvas.height*0.86);
      }

      ctx.textAlign="start";
    }

    function drawHUD(){
      ctx.fillStyle="rgba(0,0,0,0.25)";
      ctx.fillRect(0,0,canvas.width,42);

      ctx.fillStyle="#f9fafb";
      ctx.font="16px system-ui";

      if(bossActive){
        ctx.fillText("Boss, Dodge " + (bossConfig.avoidRequired - bossShotsDodged) + " more", 18, 26);
      }else{
        const remaining = Math.max(0, TOTAL_STATIONS_TO_BOSS - coinStreak);
        ctx.fillText("Total Stations Remaining, " + remaining, 18, 26);
      }
    }

    function drawGameOverScreen(){
      if(images.gameOver.width) ctx.drawImage(images.gameOver, 0, 0, canvas.width, canvas.height);

      ctx.fillStyle="rgba(0,0,0,0.55)";
      ctx.fillRect(0,0,canvas.width,canvas.height);

      const baseY=canvas.height-80;

      ctx.fillStyle="#f9fafb";
      ctx.textAlign="center";
      ctx.font="18px system-ui";
      ctx.fillText("Total Stations Collected, " + coinsCollected, canvas.width/2, baseY);
      ctx.fillText("High Score, " + highScore.initials + " " + highScore.score, canvas.width/2, baseY+22);

      if(gameState==="enter_initials" && enteringInitials){
        drawInitialsUI(baseY);
      }else{
        if(newHighScore){
          ctx.fillStyle="#ff8080";
          ctx.fillText("NEW HIGH SCORE", canvas.width/2, baseY-24);
        }
        ctx.fillStyle="#f9fafb";
        ctx.fillText("Press R or TAP to Restart", canvas.width/2, baseY+46);
      }

      ctx.textAlign="start";
    }

    function drawInitialsUI(baseY){
      const centerX=canvas.width/2;

      ctx.fillStyle="#ff8080";
      ctx.font="18px system-ui";
      ctx.textAlign="center";
      ctx.fillText("NEW HIGH SCORE, ENTER INITIALS", centerX, baseY-24);

      ctx.font="22px system-ui";
      ctx.fillStyle="#f9fafb";

      const spacing=40;
      const letterY=baseY+40;
      const upY=letterY-24;
      const downY=letterY+20;

      for(let i=0;i<3;i++){
        const lx=centerX+(i-1)*spacing;
        ctx.fillText("▲", lx, upY);
        ctx.fillText(initials[i], lx, letterY);
        ctx.fillText("▼", lx, downY);
      }

      const okWidth=80, okHeight=32;
      const okX=centerX-okWidth/2, okY=baseY+70;
      ctx.fillStyle="#111827";
      ctx.fillRect(okX,okY,okWidth,okHeight);
      ctx.strokeStyle="#f9fafb";
      ctx.strokeRect(okX,okY,okWidth,okHeight);

      ctx.fillStyle="#f9fafb";
      ctx.font="16px system-ui";
      ctx.fillText("OK", centerX, okY+22);

      ctx.textAlign="start";
    }

    // ===== Game flow =====
    function triggerGameOver(){
      if(gameState==="gameover" || gameState==="enter_initials") return;

      playSound(deathSound);
      stopMusic();
      bossActive=false;

      if(score>highScore.score){
        enteringInitials=true;
        newHighScore=false;
        initials=["A","A","A"];
        currentInitialIndex=0;
        gameState="enter_initials";
      }else{
        enteringInitials=false;
        newHighScore=false;
        gameState="gameover";
      }
    }

    function resetGame(){
      dumpsters.length=0;
      drones.length=0;
      coins.length=0;
      hats.length=0;
      bossProjectiles.length=0;

      frameCount=0;
      score=0;
      coinsCollected=0;
      coinStreak=0;

      invulnerableFrames=0;
      newHighScore=false;
      enteringInitials=false;

      bossActive=false;
      bossDefeated=false;
      bossShotsDodged=0;
      bossProjectileTimer=0;
      bossAnimState="idle";
      bossAnimTimer=0;

      hazardTimer=100;
      coinTimer=150;
      hatTimer=700;

      levelCompleteAt = 0;

      runTime = 0;
      speedBoostFromCoins = 0;

      setPlayerSize("big");
      player.vy=0;
      player.state="run";
      player.onGround=true;
    }

    // ===== Input =====
    function getCanvasPos(evt){
      const rect=canvas.getBoundingClientRect();
      let cx,cy;
      if(evt.touches && evt.touches[0]){
        cx=evt.touches[0].clientX;
        cy=evt.touches[0].clientY;
      }else{
        cx=evt.clientX;
        cy=evt.clientY;
      }
      const x=(cx-rect.left)*(canvas.width/rect.width);
      const y=(cy-rect.top)*(canvas.height/rect.height);
      return {x,y};
    }

    function handleInitialsPointer(x,y){
      const baseY=canvas.height-80;
      const centerX=canvas.width/2;
      const spacing=40;
      const letterY=baseY+40;
      const upY=letterY-24;
      const downY=letterY+20;

      for(let i=0;i<3;i++){
        const lx=centerX+(i-1)*spacing;
        const upBox   ={x1:lx-15,x2:lx+15,y1:upY-20,y2:upY};
        const downBox ={x1:lx-15,x2:lx+15,y1:downY-16,y2:downY+6};

        if(x>=upBox.x1 && x<=upBox.x2 && y>=upBox.y1 && y<=upBox.y2){
          incrementLetter(i); currentInitialIndex=i; return;
        }
        if(x>=downBox.x1 && x<=downBox.x2 && y>=downBox.y1 && y<=downBox.y2){
          decrementLetter(i); currentInitialIndex=i; return;
        }
      }

      const okWidth=80, okHeight=32;
      const okX=centerX-okWidth/2, okY=baseY+70;
      if(x>=okX && x<=okX+okWidth && y>=okY && y<=okY+okHeight){
        saveHighScoreFromInitials();
      }
    }

    function doJump(){
      if(player.onGround){
        player.vy=-30;
        player.onGround=false;
        player.state="jump";
      }
    }

    window.addEventListener("keydown", async (e)=>{
      await armAudioOnce();

      const key=e.key;

      if(gameState==="title"){
        gameState="levelIntro";
        return;
      }

      if(gameState==="levelIntro"){
        resetGame();
        await playLevelMusic();
        gameState="playing";
        return;
      }

      if(gameState==="bossCut"){
        gameState="playing";
        startBossFight();
        return;
      }

      if(gameState==="playing"){
        if(key===" " || key==="ArrowUp") doJump();
        return;
      }

      if(gameState==="gameover"){
        if(key.toLowerCase()==="r"){
          resetGame();
          await playLevelMusic();
          gameState="playing";
        }
        return;
      }

      if(gameState==="levelComplete"){
        if(currentLevel === 1){
          currentLevel = 2;
          gameState    = "levelIntro";
        }else{
          stopMusic();
          window.location.href = LEVEL3_URL;
        }
      }
    });

    async function handleTap(evt){
      if(evt && evt.cancelable) evt.preventDefault();
      await armAudioOnce();

      if(gameState==="title"){
        gameState="levelIntro";
        return;
      }

      if(gameState==="levelIntro"){
        resetGame();
        await playLevelMusic();
        gameState="playing";
        return;
      }

      if(gameState==="bossCut"){
        gameState="playing";
        startBossFight();
        return;
      }

      if(gameState==="playing"){
        doJump();
        return;
      }

      if(gameState==="enter_initials" && enteringInitials){
        const pos = getCanvasPos(evt);
        handleInitialsPointer(pos.x, pos.y);
        return;
      }

      if(gameState==="gameover"){
        resetGame();
        await playLevelMusic();
        gameState="playing";
        return;
      }

      if(gameState==="levelComplete"){
        if(currentLevel === 1){
          currentLevel = 2;
          gameState    = "levelIntro";
        }else{
          stopMusic();
          window.location.href = LEVEL3_URL;
        }
      }
    }

    canvas.addEventListener("touchstart", handleTap, {passive:false});
    canvas.addEventListener("mousedown", handleTap);

    // ===== Init =====
    function initGame(){
      initFirebase();

      bigHeight = canvas.height * 0.28;
      const bigScale   = bigHeight / images.stand.height;
      bigWidth  = images.stand.width * bigScale;

      smallHeight = bigHeight * 0.65;
      const smallScale = smallHeight / images.stand.height;
      smallWidth  = images.stand.width * smallScale;

      groundY = canvas.height - 40;

      setPlayerSize("big");
      resetGame();
      gameState = "title";
      assetsReady = true;

      requestAnimationFrame(gameLoop);
    }

    // ===== Main loop =====
    function gameLoop(){
      if(!assetsReady){
        requestAnimationFrame(gameLoop);
        return;
      }

      ctx.clearRect(0,0,canvas.width,canvas.height);

      if(gameState==="playing" || gameState==="gameover" ||
         gameState==="enter_initials" || gameState==="levelComplete"){
        drawScrollingBackground();
      }else if(gameState==="bossCut"){
        ctx.fillStyle="#000";
        ctx.fillRect(0,0,canvas.width,canvas.height);
      }else{
        const bg = getActiveBgImage();
        if(bg.width && bg.height){
          const scale=canvas.height/bg.height;
          const w=bg.width*scale, h=canvas.height;
          ctx.drawImage(bg,0,0,w,h);
          ctx.drawImage(bg,w,0,w,h);
        }
      }

      if(gameState==="title"){
        drawTitleScreen();
      }else if(gameState==="levelIntro"){
        drawLevelIntroScreen();
      }else if(gameState==="bossCut"){
        drawBossCutScreen();
      }else if(gameState==="levelComplete"){
        drawLevelCompleteScreen();

        if(currentLevel === 2){
          if(!levelCompleteAt) levelCompleteAt = performance.now();
          if(performance.now() - levelCompleteAt >= LEVEL2_COMPLETE_REDIRECT_DELAY_MS){
            stopMusic();
            window.location.href = LEVEL3_URL;
            return;
          }
        }
      }else{
        updateWorldObjects();
        updatePlayer();

        drawDumpsters();
        drawDrones();
        drawHats();
        drawCoins();
        drawBoss();
        if(bossActive){
          drawBossProjectiles();
        }

        drawPlayer();
        drawHUD();

        if(gameState==="gameover" || gameState==="enter_initials"){
          drawGameOverScreen();
        }
      }

      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
